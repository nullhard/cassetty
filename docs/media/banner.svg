<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title">
  <title id="title">cassetty, a cassette deck music player for the terminal</title>
  <style>
    text { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>
  <defs>
    <pattern id="grille" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.1" fill="#26222a"/></pattern>
    <clipPath id="card"><rect width="1000" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#1d1b21"/>
    <rect width="1000" height="300" fill="url(#grille)"/>
    <rect y="280" width="1000" height="4" fill="#e38b86"/>
    <rect y="284" width="1000" height="4" fill="#eaa978"/>
    <rect y="288" width="1000" height="4" fill="#e8d08a"/>
    <rect y="292" width="1000" height="4" fill="#a6c99a"/>
    <rect y="296" width="1000" height="4" fill="#8fb8d6"/>
  </g>
  <g font-size="96" font-weight="800" letter-spacing="-2" text-anchor="middle">
    <text x="507" y="157" fill="#8fb8d6">cassetty</text>
    <text x="504" y="154" fill="#a6c99a">cassetty</text>
    <text x="501" y="151" fill="#e8d08a">cassetty</text>
    <text x="498" y="148" fill="#eaa978">cassetty</text>
    <text x="495" y="145" fill="#e38b86">cassetty</text>
    <text x="492" y="142" fill="#f0e7dc">cassetty</text>
  </g>
  <text x="500" y="196" font-size="17" fill="#a39a9f" text-anchor="middle">a cassette deck music player for the terminal</text>
  <text x="500" y="228" font-size="13" fill="#8f8594" letter-spacing="2" text-anchor="middle">MACOS · LINUX · SEVEN SKINS</text>
</svg>
